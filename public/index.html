<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediQueue Reception</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>MediQueue · Reception</h1>
  <a id="boardLink" href="board.html?doctor=1" target="_blank">Open display board ↗</a>
</header>

<main>
  <!-- Left column: data entry -->
  <section>
    <div class="card">
      <h2>Register patient</h2>
      <form id="patientForm">
        <input name="name" placeholder="Name" required>
        <div class="row"><input name="phone" placeholder="Phone" required><input name="age" type="number" placeholder="Age" min="0" max="130" required></div>
        <button>Register</button>
      </form>
    </div>

    <div class="card">
      <h2>Walk-in / Emergency token</h2>
      <form id="walkInForm">
        <select name="doctorId" class="doctorSelect" required></select>
        <select name="patientId" class="patientSelect" required></select>
        <label class="check"><input type="checkbox" name="isEmergency"> Emergency</label>
        <button>Issue token</button>
      </form>
    </div>

    <div class="card">
      <h2>Book appointment (today)</h2>
      <form id="bookForm">
        <select name="doctorId" class="doctorSelect" id="bookDoctor" required></select>
        <select name="slotId" id="slotSelect" required></select>
        <select name="patientId" class="patientSelect" required></select>
        <button>Book slot</button>
      </form>
    </div>

    <div class="card">
      <h2>Add doctor</h2>
      <form id="doctorForm">
        <input name="name" placeholder="Dr. Name" required>
        <div class="row"><input name="specialization" placeholder="Specialization" required><input name="avgConsultMins" type="number" placeholder="Mins/patient" value="10" min="1"></div>
        <button>Add doctor + today's slots (09:00–17:00)</button>
      </form>
    </div>
  </section>

  <!-- Right column: live queue operations -->
  <section>
    <div class="card">
      <h2>All doctors · live load</h2>
      <table>
        <thead><tr><th>Doctor</th><th>Now serving</th><th>Waiting</th><th>Clears in</th></tr></thead>
        <tbody id="summaryBody"></tbody>
      </table>
    </div>

    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <h2 style="margin:0">Doctor queue</h2>
        <select id="queueDoctor" class="doctorSelect"></select>
        <button id="callNextBtn">Call next ▶</button>
      </div>
      <table>
        <thead><tr><th>#</th><th>Patient</th><th>Category</th><th>Status</th><th>Score</th><th>Est. wait</th><th></th></tr></thead>
        <tbody id="queueBody"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Today's appointments</h2>
      <table>
        <thead><tr><th>Time</th><th>Patient</th><th>Doctor</th><th></th></tr></thead>
        <tbody id="apptBody"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Notifications sent</h2>
      <div id="notifLog" class="log"></div>
    </div>
  </section>
</main>
<div id="toast" class="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (sel) => document.querySelector(sel);
const today = () => new Date().toLocaleDateString('en-CA');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function toast(msg, isError = false) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = `toast show ${isError ? 'error' : ''}`;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => (t.className = 'toast'), 3000);
}

async function api(method, url, body) {
  const res = await fetch(`/api${url}`, {
    method, headers: { 'Content-Type': 'application/json' }, body: body && JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

/** Runs an action, shows success or the server's error message. */
async function act(fn, okMsg) {
  try {
    const result = await fn();
    if (okMsg) toast(typeof okMsg === 'function' ? okMsg(result) : okMsg);
    await refreshLists();
    return result;
  } catch (e) {
    toast(e.message, true);
  }
}

const formData = (form) => Object.fromEntries(new FormData(form));

// ---------- Dropdowns and lists ----------

async function refreshLists() {
  const [doctors, patients] = await Promise.all([api('GET', '/doctors'), api('GET', '/patients')]);
  for (const sel of document.querySelectorAll('.doctorSelect')) {
    const keep = sel.value;
    sel.innerHTML = doctors.map((d) => `<option value="${d.id}">${esc(d.name)} · ${esc(d.specialization)}</option>`).join('');
    if (keep) sel.value = keep;
  }
  for (const sel of document.querySelectorAll('.patientSelect')) {
    const keep = sel.value;
    sel.innerHTML = patients.map((p) => `<option value="${p.id}">#${p.id} ${esc(p.name)} (${p.age})</option>`).join('');
    if (keep) sel.value = keep;
  }
  await Promise.all([refreshSlots(), refreshAppointments(), refreshNotifications()]);
}

async function refreshSlots() {
  const doctorId = $('#bookDoctor').value;
  if (!doctorId) return;
  const slots = await api('GET', `/doctors/${doctorId}/slots?date=${today()}`);
  $('#slotSelect').innerHTML = slots.length
    ? slots.map((s) => `<option value="${s.id}">${s.start_time.slice(11)}</option>`).join('')
    : '<option value="">No free slots</option>';
}

async function refreshAppointments() {
  const appts = await api('GET', '/appointments/today');
  $('#apptBody').innerHTML = appts.map((a) => `
    <tr><td>${a.start_time.slice(11)}</td><td>${esc(a.patient_name)}</td><td>${esc(a.doctor_name)}</td>
    <td>${a.token_id ? '<span class="muted">checked in</span>' : `<button class="ghost" onclick="checkIn(${a.id})">Check in</button>`}</td></tr>`,
  ).join('') || '<tr><td colspan="4" class="muted">No appointments today</td></tr>';
}

async function refreshNotifications() {
  const list = await api('GET', '/notifications?limit=30');
  $('#notifLog').innerHTML = list.map((n) =>
    `<div><b>${n.channel}</b> → ${esc(n.patient_name)}: ${esc(n.message)}</div>`).join('') || '<span class="muted">None yet</span>';
}

// ---------- Live data via WebSocket ----------

const socket = io();
socket.emit('watch:summary');
socket.on('summary', (rows) => {
  $('#summaryBody').innerHTML = rows.map((r) => `
    <tr><td>${esc(r.doctorName)} <span class="muted">${esc(r.specialization)}</span></td>
    <td>${r.nowServing ?? '—'}</td><td>${r.waiting}</td><td>${r.estimatedClearMins} min</td></tr>`).join('');
  refreshNotifications();
});

let watchedDoctor = null;
function watchDoctor(id) {
  if (!id || id === watchedDoctor) return;
  watchedDoctor = id;
  socket.emit('watch:doctor', id);
  $('#boardLink').href = `board.html?doctor=${id}`;
}

socket.on('queue', (q) => {
  if (String(q.doctor.id) !== String(watchedDoctor)) return;
  const rows = [...q.current, ...q.waiting];
  $('#queueBody').innerHTML = rows.map((t) => `
    <tr>
      <td><b>${t.token_no}</b></td>
      <td>${esc(t.patient_name)}</td>
      <td><span class="badge ${t.category}">${t.category}</span></td>
      <td class="status">${t.status}</td>
      <td>${t.score ?? ''}</td>
      <td>${t.estimatedWaitMins != null ? t.estimatedWaitMins + ' min' : ''}</td>
      <td class="row">${actionsFor(t)}</td>
    </tr>`).join('') || '<tr><td colspan="7" class="muted">Queue is empty</td></tr>';
});

function actionsFor(t) {
  if (t.status === 'CALLED') return `
    <button onclick="tokenAction(${t.id}, 'start')">Start</button>
    <button class="danger" onclick="tokenAction(${t.id}, 'no-show')">No-show</button>`;
  if (t.status === 'IN_CONSULTATION') return `<button onclick="completeToken(${t.id})">Complete</button>`;
  return '';
}

// ---------- Actions ----------

window.tokenAction = (id, action) => act(() => api('POST', `/tokens/${id}/${action}`));
window.completeToken = (id) => {
  const notes = prompt('Consultation notes:') ?? '';
  const prescription = prompt('Prescription:') ?? '';
  act(() => api('POST', `/tokens/${id}/complete`, { notes, prescription }), 'Consultation saved to history');
};
window.checkIn = (id) => act(() => api('POST', `/appointments/${id}/check-in`), (t) => `Token #${t.token_no} (${t.category})`);

$('#callNextBtn').onclick = () =>
  act(() => api('POST', `/queues/${$('#queueDoctor').value}/call-next`), (t) => `Calling token #${t.token_no}: ${t.patient_name}`);

$('#queueDoctor').onchange = (e) => watchDoctor(e.target.value);
$('#bookDoctor').onchange = refreshSlots;

$('#patientForm').onsubmit = (e) => {
  e.preventDefault();
  act(() => api('POST', '/patients', formData(e.target)), (p) => `Registered ${p.name} (#${p.id})`).then((p) => p && e.target.reset());
};

$('#walkInForm').onsubmit = (e) => {
  e.preventDefault();
  const body = { ...formData(e.target), isEmergency: e.target.isEmergency.checked };
  act(() => api('POST', '/tokens', body), (t) => `Token #${t.token_no} issued (${t.category})`);
};

$('#bookForm').onsubmit = (e) => {
  e.preventDefault();
  const { slotId, patientId } = formData(e.target);
  act(() => api('POST', '/appointments', { slotId: Number(slotId), patientId: Number(patientId) }), 'Appointment booked');
};

$('#doctorForm').onsubmit = (e) => {
  e.preventDefault();
  act(async () => {
    const d = await api('POST', '/doctors', formData(e.target));
    await api('POST', `/doctors/${d.id}/slots`, { date: today(), from: '09:00', to: '17:00' });
    e.target.reset();
    return d;
  }, (d) => `Added ${d.name} with today's slots`);
};

refreshLists().then(() => watchDoctor($('#queueDoctor').value));
</script>
</body>
</html>
