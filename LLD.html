<style>
/* Layout: sticky ward-board tab bar over one view at a time; every view links back into the class map (traceability). */

  --senior: #b8730a;
  --appt: #2a5fb0;
  --walkin: #5f6f68;
  --ok: #217a45;
  --bad: #b3261e;
  --bad-soft: #f8dedb;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;

  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1513; --surface: #15211e; --sunk: #1b2925; --line: #2c3d38; --ink: #e2ece8; --muted: #93a7a0;
    --accent: #4cc2b5; --accent-soft: #173a35; --board: #07100e; --board-ink: #d8f1ea;
    --emerg: #f0766b; --senior: #e3a33f; --appt: #7aa7ec; --walkin: #9aaba4; --ok: #5dc488; --bad: #f2847b; --bad-soft: #3b1d1b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1513; --surface: #15211e; --sunk: #1b2925; --line: #2c3d38; --ink: #e2ece8; --muted: #93a7a0;
  --accent: #4cc2b5; --accent-soft: #173a35; --board: #07100e; --board-ink: #d8f1ea;
  --emerg: #f0766b; --senior: #e3a33f; --appt: #7aa7ec; --walkin: #9aaba4; --ok: #5dc488; --bad: #f2847b; --bad-soft: #3b1d1b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }

.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header / board */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--board); color: var(--board-ink); }
.top .wrap { display: flex; align-items: center; gap: 18px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }

.brand span { font-family: var(--mono); font-size: .72rem; opacity: .7; text-transform: uppercase; letter-spacing: .08em; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: .74rem; padding: 2px 8px; border-radius: 3px; background: var(--sunk); color: var(--ink); border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--accent); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: .86rem; }

.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.scroll-x { overflow-x: auto; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: .9rem; }

.rootbar { writing-mode: vertical-rl; transform: rotate(180deg); background: var(--accent-soft); border: 1px dashed var(--accent); border-radius: 6px; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--mono); font-size: .78rem; color: var(--accent); cursor: pointer; padding: 10px 0; }
@media (max-width: 720px) {
  .stack { grid-template-columns: 1fr; }

}
.contract { font-family: var(--mono); font-size: .8rem; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.contract span { padding: 3px 8px; background: var(--sunk); border-radius: 3px; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }

/* classes */

@media (max-width: 900px) { .cls-grid { grid-template-columns: 1fr; } }
.lens { display: grid; gap: 10px; }
.lens .label { font-family: var(--mono); font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.pkg { display: grid; gap: 6px; }
.pkg + .pkg { margin-top: 14px; }
.pkg h4 { margin: 0; font-family: var(--mono); font-size: .74rem; color: var(--muted); font-weight: 500; }
.cards { display: flex; flex-wrap: wrap; gap: 6px; }
.cls { font-family: var(--mono); font-size: .8rem; padding: 6px 9px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; }

.detail { position: sticky; top: 76px; display: grid; gap: 14px; }

.methods { font-family: var(--mono); font-size: .8rem; background: var(--sunk); border-radius: 5px; padding: 10px 12px; display: grid; gap: 2px; overflow-x: auto; }

.lensnote { font-size: .88rem; color: var(--muted); border-left: 3px solid var(--accent); padding-left: 10px; }

/* sequence */
.flowpick { display: flex; flex-wrap: wrap; gap: 6px; }
.seqbox { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
.seqbox svg { display: block; }
.seq-part rect { fill: var(--board); }
.seq-part text { fill: var(--board-ink); font-family: var(--mono); font-size: 11px; }
.seq-life { stroke: var(--line); stroke-dasharray: 4 4; }
.seq-msg line, .seq-msg path { stroke: var(--muted); stroke-width: 1.3; fill: none; }
.seq-msg text { fill: var(--muted); font-family: var(--mono); font-size: 11px; }
.seq-msg.ret line { stroke-dasharray: 5 4; }
.seq-msg.future { opacity: .18; }
.seq-msg.cur line, .seq-msg.cur path { stroke: var(--accent); stroke-width: 2.4; }
.seq-msg.cur text { fill: var(--ink); font-weight: 700; }
.seq-msg.err.cur line, .seq-msg.err.cur path { stroke: var(--bad); }
.seq-msg .num { fill: var(--accent); font-weight: 700; }
.seq-act { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
.mk-past { fill: var(--muted); } .mk-cur { fill: var(--accent); } .mk-err { fill: var(--bad); }
.stepper { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; }
.stepnum { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 2.4rem; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 2.2ch; }
.stepnote b { font-family: var(--mono); font-size: .86rem; }
.stepnote p { margin-top: 4px; color: var(--muted); max-width: 70ch; }

/* lifecycle */
.life { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 900px) { .life { grid-template-columns: 1fr; } }
.sm-node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.sm-node text { fill: var(--ink); font-family: var(--mono); font-size: 12px; font-weight: 700; }
.sm-node.term rect { stroke-dasharray: 5 3; }
.sm-node.cur rect { fill: var(--accent); stroke: var(--accent); }
.sm-node.cur text { fill: #fff; }
.sm-edge path { stroke: var(--muted); stroke-width: 1.5; fill: none; }
.sm-edge text { fill: var(--muted); font-family: var(--mono); font-size: 11px; }
.sm-edge.live path { stroke: var(--accent); stroke-width: 2.5; }
.sm-edge.live text { fill: var(--accent); font-weight: 700; }
.mk-sm { fill: var(--muted); }
.log { font-family: var(--mono); font-size: .78rem; display: grid; gap: 4px; max-height: 260px; overflow-y: auto; }
.log div { padding: 5px 8px; border-radius: 4px; background: var(--sunk); }
.log .bad { background: var(--bad-soft); color: var(--bad); }
.log .good { color: var(--ok); }

.prio { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .prio { grid-template-columns: 1fr; } }
.board { background: var(--board); color: var(--board-ink); border-radius: 8px; padding: 16px; display: grid; gap: 12px; }
.board-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
.clock { font-family: var(--mono); font-size: 1.7rem; font-weight: 700; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.board label { font-family: var(--mono); font-size: .72rem; opacity: .75; }
.board input[type=range] { width: 100%; accent-color: var(--accent); }
.qrow { display: grid; grid-template-columns: 28px 52px minmax(0, 1fr) 72px; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 5px; background: rgba(255,255,255,.05); transition: transform .25s; }
.qrow .pos { font-family: var(--mono); opacity: .6; font-size: .8rem; }
.qrow .tok { font-family: var(--mono); font-weight: 700; font-size: 1.15rem; }
.qrow .who { min-width: 0; }
.qrow .who b { font-weight: 600; }
.qrow .who small { display: block; font-family: var(--mono); font-size: .7rem; opacity: .7; }
.bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); margin-top: 5px; overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }
.bar .age { background: repeating-linear-gradient(45deg, var(--board-ink) 0 3px, transparent 3px 6px); opacity: .55; }
.qrow .score { font-family: var(--mono); text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.qrow .score small { display: block; font-weight: 400; font-size: .68rem; opacity: .7; }
.cat { display: inline-block; font-family: var(--mono); font-size: .64rem; font-weight: 700; padding: 1px 5px; border-radius: 2px; color: #fff; margin-left: 6px; vertical-align: 1px; }
.c-EMERGENCY { background: var(--emerg); } .c-SENIOR { background: var(--senior); } .c-APPOINTMENT { background: var(--appt); } .c-WALKIN { background: var(--walkin); }
.seg { display: inline-flex; border: 1px solid rgba(255,255,255,.2); border-radius: 4px; overflow: hidden; }
.seg button { background: transparent; border: 0; color: var(--board-ink); font-family: var(--mono); font-size: .74rem; padding: 4px 9px; cursor: pointer; }
.seg button.on { background: var(--accent); color: #fff; }
.form { display: grid; gap: 10px; }
.form .f { display: grid; gap: 4px; }
.form label { font-size: .8rem; color: var(--muted); }
.form input[type=text], .form input[type=number] { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--ink); width: 100%; }

/* data */
.er svg { display: block; }
.er-node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; cursor: pointer; }

.tables { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.tcard { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }

.k { font-size: .62rem; font-weight: 700; padding: 0 4px; border-radius: 2px; margin-left: 4px; }
.k.pk { background: var(--accent); color: #fff; } .k.fk { background: var(--sunk); color: var(--ink); border: 1px solid var(--line); } .k.uq { background: var(--senior); color: #fff; }

.cons code { color: var(--accent); }
.cons p { color: var(--muted); }

.tbl { width: 100%; border-collapse: collapse; font-size: .86rem; }

<script>
/* ===================== DATA (mirrors LLD.md and src/) ===================== */
const LAYERS = [
  { id: 'ctrl', name: 'Controllers', note: 'HTTP in / out. Parse only.' },
  { id: 'svc', name: 'Services', note: 'Business rules, transactions, events.' },
  { id: 'dom', name: 'Domain', note: 'Token, states, categories, errors.' },
  { id: 'strat', name: 'Strategies', note: 'Swappable rules.' },
  { id: 'notif', name: 'Notifications', note: 'Delivery channels.' },
  { id: 'repo', name: 'Repositories', note: 'All SQL lives here.' },
  { id: 'infra', name: 'Infrastructure', note: 'DB, clock, events, sockets.' },
];

const C = [
  // controllers
  { id:'AppointmentController', layer:'ctrl', kind:'class', file:'controllers/AppointmentController.js', role:'Maps /api/appointments routes (book, list today, get, check-in) onto services.', methods:['POST /api/appointments','GET /api/appointments/today','GET /api/appointments/:id','POST /api/appointments/:id/check-in'], deps:['AppointmentService','QueueService'], fr:['FR-4','FR-7'] },
  { id:'DoctorController', layer:'ctrl', kind:'class', file:'controllers/DoctorController.js', role:'Doctor registration and slot routes.', methods:['POST /api/doctors','GET /api/doctors','POST /api/doctors/:id/slots','GET /api/doctors/:id/slots'], deps:['DoctorService'], fr:['FR-1','FR-2'] },
  { id:'PatientController', layer:'ctrl', kind:'class', file:'controllers/PatientController.js', role:'Patient registration, lookup and history routes.', methods:['POST /api/patients','GET /api/patients[/:id]','GET /api/patients/:id/history'], deps:['PatientService'], fr:['FR-3','FR-15'] },

function paintSeq() {
  const F = FLOWS[flowKey], msgs = F.scenarios[scenKey], P = F.parts;
  const CW = 128, LX = 72, TOP = 54, RH = 38, H = TOP + msgs.length * RH + 30, W = LX * 2 + (P.length - 1) * CW;
  const x = p => LX + P.indexOf(p) * CW;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(F.title)} sequence diagram">
  <defs>${['past','cur','err'].map(k => `<marker id="a-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-${k}"/></marker>`).join('')}</defs>`;
  // transaction box
  const o = msgs.findIndex(m => (m[5] || m[4] || '').includes('open')), cl = msgs.findIndex(m => (m[5] || m[4] || '').includes('close'));
  if (o >= 0 && cl >= 0 && step >= o) {
    const dx = x('Database');
    s += `<rect class="seq-act" x="${dx - 6}" y="${TOP + o * RH + 14}" width="12" height="${(Math.min(cl, step) - o) * RH + 10}" rx="2"/>`;
  }
  P.forEach(p => {
    const px = x(p);
    s += `<line class="seq-life" x1="${px}" y1="34" x2="${px}" y2="${H - 6}"/>`;
    s += `<g class="seq-part"><rect x="${px - 60}" y="6" width="120" height="28" rx="4"/><text x="${px}" y="24" text-anchor="middle">${esc(shortName(p))}</text></g>`;
  });
  msgs.forEach((m, i) => {
    const [from, to, label] = m, kind = (m[4] || '');
    const isRet = kind.includes('ret'), isErr = kind.includes('err'), isSelf = kind.includes('self') || from === to;
    const st = i < step ? 'past' : i === step ? 'cur' : 'future';
    const mk = st === 'cur' ? (isErr ? 'err' : 'cur') : 'past';
    const y = TOP + i * RH + 20, x1 = x(from), x2 = x(to);
    s += `<g class="seq-msg ${st}${isRet ? ' ret' : ''}${isErr ? ' err' : ''}">`;
    if (isSelf) {
      s += `<path d="M${x1},${y - 6} h34 v14 h-32" marker-end="url(#a-${mk})"/><text x="${x1 + 40}" y="${y + 4}">${esc(label)}</text>`;
    } else {
      const dir = x2 > x1 ? 1 : -1;
      s += `<line x1="${x1}" y1="${y}" x2="${x2 - dir * 2}" y2="${y}" marker-end="url(#a-${mk})"/>`;
      const lx = (x1 + x2) / 2;
      s += `<text x="${lx}" y="${y - 6}" text-anchor="middle">${esc(label)}</text>`;
    }
    s += `<text class="num" x="${Math.min(x1, isSelf ? x1 : x2) - 4}" y="${y - 6}" text-anchor="end">${i + 1}</text></g>`;
  });
  s += '</svg>';
  $('#seq').innerHTML = s;
  const m = msgs[step];
  $('#stepnum').textContent = String(step + 1).padStart(2, '0');
  $('#stepnote').innerHTML = `<b>${esc(m[0])} → ${esc(m[1])}</b><div class="mono" style="margin-top:2px">${esc(m[2])}</div><p>${esc(m[3] || 'Step ' + (step + 1) + ' of ' + msgs.length + '.')}</p>`;
  $('#prev').disabled = step === 0; $('#next').disabled = step === msgs.length - 1;
  const cur = $('#seq .seq-msg.cur');
  if (cur) { const box = $('#seq'), b = cur.getBBox(); if (b.x < box.scrollLeft || b.x + b.width > box.scrollLeft + box.clientWidth) box.scrollTo({ left: Math.max(0, b.x - 40), behavior: 'smooth' }); }
}

/* ---------- Lifecycle ---------- */
const SM = { WAITING:[70,110], CALLED:[260,110], IN_CONSULTATION:[470,110], DONE:[680,110], NO_SHOW:[260,240] };
const MOVES = { WAITING:{call:'CALLED'}, CALLED:{start:'IN_CONSULTATION', noShow:'NO_SHOW'}, IN_CONSULTATION:{complete:'DONE'}, DONE:{}, NO_SHOW:{} };
const VERB = { call:'call', start:'start', complete:'complete', noShow:'mark no-show for' };
let tok = 'WAITING', tlog = [], lastEdge = null;
function lifecycle(el) {
  el.innerHTML = `
  <section class="view">
    <div class="head"><div class="eyebrow">State pattern · FR-10</div><h2>Drive a token through its lifecycle</h2>
      <p class="lede">Token delegates every move to its current state object. Each state overrides only the moves that are legal from it; everything else falls through to the base class, which throws <code>ConflictError</code> (409). Try an illegal move.</p></div>
    <div class="life">
      <div class="panel"><div class="scroll-x" id="sm"></div>
        <div class="row" style="margin-top:12px">${Object.keys(VERB).map(v => `<button class="btn" data-move="${v}">token.${v}()</button>`).join('')}<button class="btn" data-move="reset">Issue new token</button></div></div>
      <div class="panel" style="display:grid;gap:10px;align-content:start"><h3>Transition log</h3><div class="log" id="tlog"></div></div>
    </div>
    <div class="panel"><h3>Why not a status switch?</h3><p class="lede" style="margin-top:6px">With an <code>if/else</code> on status, every new state means editing every method. Here a new state is one subclass, and illegal moves are rejected by default instead of by remembering to add a check. The database adds a second guard: <code>CHECK status IN (...)</code>.</p></div>
  </section>`;
  paintSM();
}
function paintSM() {
  const E = [['WAITING','CALLED','call'],['CALLED','IN_CONSULTATION','start'],['IN_CONSULTATION','DONE','complete'],['CALLED','NO_SHOW','noShow']];
  const w = { WAITING:110, CALLED:110, IN_CONSULTATION:150, DONE:90, NO_SHOW:100 };
  let s = `<svg width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="Token state machine"><defs><marker id="sm-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mk-sm"/></marker></defs>`;
  s += `<circle cx="14" cy="110" r="7" style="fill:var(--ink)"/><path d="M21,110 H${SM.WAITING[0] - w.WAITING / 2 - 3}" style="stroke:var(--muted);stroke-width:1.5" marker-end="url(#sm-a)"/>`;
  E.forEach(([a, b, l]) => {
    const [ax, ay] = SM[a], [bx, by] = SM[b];
    let d, tx, ty;
    if (ay === by) { d = `M${ax + w[a] / 2},${ay} H${bx - w[b] / 2 - 3}`; tx = (ax + w[a] / 2 + bx - w[b] / 2) / 2; ty = ay - 10; }
    else { d = `M${ax},${ay + 20} V${by - 23}`; tx = ax + 10; ty = (ay + by) / 2 + 4; }
    s += `<g class="sm-edge${lastEdge === l ? ' live' : ''}"><path d="${d}" marker-end="url(#sm-a)"/><text x="${tx}" y="${ty}" text-anchor="${ay === by ? 'middle' : 'start'}">${l}()</text></g>`;
  });
  Object.entries(SM).forEach(([n, [x, y]]) => {
    const term = n === 'DONE' || n === 'NO_SHOW';
    s += `<g class="sm-node${n === tok ? ' cur' : ''}${term ? ' term' : ''}"><rect x="${x - w[n] / 2}" y="${y - 20}" width="${w[n]}" height="40" rx="20"/><text x="${x}" y="${y + 4}" text-anchor="middle">${n}</text></g>`;
  });
  s += `<text x="680" y="160" text-anchor="middle" style="fill:var(--muted);font:11px var(--mono)">terminal</text><text x="260" y="290" text-anchor="middle" style="fill:var(--muted);font:11px var(--mono)">terminal</text></svg>`;
  $('#sm').innerHTML = s;
  $('#tlog').innerHTML = tlog.length ? tlog.slice().reverse().map(e => `<div class="${e.c}">${esc(e.t)}</div>`).join('') : '<div>Token #4 issued → WAITING</div>';

}

  paintChain(); paintQ();
}
function chainCtx() { return { age: Number($('#page').value) || 0, isEmergency: $('#pemerg').checked, appt: $('#pappt').checked }; }
function paintChain() {
  const r = resolveChain(chainCtx());
  $('#chain').innerHTML = r.rules.map((x, i) => `<div class="${i === r.win ? 'won' : i > r.win ? 'skip' : ''}"><span>${i + 1}. ${x[0]}</span><span>${i < r.win ? 'null' : i === r.win ? '→ ' + x[1] : 'not asked'}</span></div>`).join('');
}
function paintQ() {
  $('#clockv').textContent = hhmm(nowMin);
  $('#atnow').textContent = hhmm(nowMin);
  const rows = pq.filter(t => t.at <= nowMin).map(t => {
    const waited = nowMin - t.at, age = waited * ppm;
    return { ...t, waited, age, score: WEIGHT[t.cat] + age };
  }).sort((a, b) => b.score - a.score || a.at - b.at);
  const max = Math.max(1200, ...rows.map(r => r.score));
  $('#q').innerHTML = rows.map((r, i) => `<div class="qrow"><span class="pos">${i + 1}</span><span class="tok">#${String(r.no).padStart(2, '0')}</span>
    <div class="who"><b>${esc(r.name)}</b><span class="cat c-${r.cat}">${r.cat}</span><small>arrived ${hhmm(r.at)} · waited ${r.waited} min · est. wait ${i * 10} min</small>
      <div class="bar"><span class="c-${r.cat}" style="width:${WEIGHT[r.cat] / max * 100}%"></span><span class="age" style="width:${r.age / max * 100}%"></span></div></div>
    <div class="score">${r.score}<small>${WEIGHT[r.cat]} + ${r.age}</small></div></div>`).join('') || '<div style="opacity:.7">Nobody waiting.</div>';
}

/* ---------- Data ---------- */
let selT = store.get('table', 'tokens');
const ER = { doctors:[20,40], patients:[20,210], slots:[225,40], appointments:[225,210], tokens:[440,125], consultations:[650,45], notifications:[650,205] };
const EREDGES = [['doctors','slots','1 : N'],['doctors','tokens','1 : N'],['patients','appointments','1 : N'],['patients','tokens','1 : N'],['slots','appointments','1 : 0..1',1],['appointments','tokens','1 : 0..1',1],['tokens','consultations','1 : 0..1',1],['tokens','notifications','1 : N']];
function data(el) {
  const BW = 140, BH = 40, c = n => [ER[n][0] + BW / 2, ER[n][1] + BH / 2];
  let svg = `<svg width="810" height="270" viewBox="0 0 810 270" role="img" aria-label="Entity relationship diagram">`;
  EREDGES.forEach(([a, b, l, u]) => { const [x1, y1] = c(a), [x2, y2] = c(b), mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    svg += `<g class="er-edge${u ? ' uniq' : ''}"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><rect x="${mx - 30}" y="${my - 8}" width="60" height="16" rx="3"/><text x="${mx}" y="${my + 4}" text-anchor="middle">${l}</text></g>`; });
  Object.entries(ER).forEach(([n, [x, y]]) => { svg += `<g class="er-node${n === selT ? ' sel' : ''}" data-table="${n}" tabindex="0" role="button"><rect x="${x}" y="${y}" width="${BW}" height="${BH}" rx="5"/><text x="${x + BW / 2}" y="${y + 25}" text-anchor="middle">${n}</text></g>`; });
  svg += '</svg>';
  el.innerHTML = `
  <section class="view">
    <div class="head"><div class="eyebrow">SQLite · WAL · foreign_keys = ON</div><h2>Tables and the constraints that enforce the rules</h2>
      <p class="lede">The teal edges are 1-to-0..1 relationships backed by a UNIQUE constraint. Those constraints are the concurrency guarantees: the database refuses the second writer, so no in-memory lock is needed. Select a table to jump to it.</p></div>
    <div class="panel er scroll-x">${svg}</div>
    <div class="tables">${TABLES.map(t => `<article class="tcard${t.id === selT ? ' sel' : ''}" id="t-${t.id}"><header><span>${t.id}</span><span style="opacity:.6">${t.cols.length} cols</span></header>
      <ul>${t.cols.map(([n, ty, k]) => `<li><span>${n}${(k || '').split(' ').filter(Boolean).map(x => `<span class="k ${x}">${x.toUpperCase()}</span>`).join('')}</span><span>${ty}</span></li>`).join('')}</ul>
      ${t.cons.length ? `<div class="cons">${t.cons.map(([k, w, f]) => `<div><code>${esc(k)}</code> <a class="chip" href="#trace" data-fr="${f}">${f}</a><p>${esc(w)}</p></div>`).join('')}</div>` : ''}</article>`).join('')}</div>
  </section>`;
}

/* ---------- API ---------- */
function api(el) {
  el.innerHTML = `
  <section class="view">
    <div class="head"><div class="eyebrow">REST + WebSocket</div><h2>API surface</h2>
      <p class="lede">Every route maps to exactly one service call. Errors always come back as <code>{ "error": message }</code> with the status carried by the thrown <code>AppError</code>.</p></div>
    <input class="search" id="apiq" type="search" placeholder="Filter by path or service…" aria-label="Filter endpoints">
    <div class="panel scroll-x" style="padding:6px"><table class="tbl"><thead><tr><th>Method</th><th>Path</th><th>Body / query</th><th>Service</th><th>Success</th><th>Errors</th></tr></thead><tbody id="apib"></tbody></table></div>
    <div class="rules">
      <div class="panel"><h3>WebSocket</h3><p><code>watch:doctor</code> joins room <code>doctor:&lt;id&gt;</code> and receives <code>queue</code>. <code>watch:summary</code> receives <code>summary</code>. Pushed on every <code>queue.changed</code>.</p></div>
      <div class="panel"><h3>Error mapping</h3><p>ValidationError → 400 · NotFoundError → 404 · ConflictError → 409 · malformed JSON → 400 · anything else → 500 (logged).</p></div>
    </div>
  </section>`;
  paintApi('');
}
function paintApi(q) {
  q = q.toLowerCase();
  $('#apib').innerHTML = API.filter(r => !q || r.join(' ').toLowerCase().includes(q)).map(([m, p, b, s, ok, er]) => {
    const svc = s.split('.')[0];
    return `<tr><td><span class="m ${m}">${m}</span></td><td class="path">${esc(p)}</td><td class="mono" style="font-size:.76rem">${esc(b)}</td><td>${byId[svc] ? `<button class="chip" data-goto="${svc}">${esc(s)}</button>` : esc(s)}</td><td class="st">${esc(ok)}</td><td class="st"><span class="e">${esc(er)}</span></td></tr>`;
  }).join('');
}

/* ---------- Trace ---------- */
let traceQ = '';
function trace(el) {
  el.innerHTML = `
  <section class="view">
    <div class="head"><div class="eyebrow">Requirement → design → code → proof</div><h2>Traceability matrix</h2>
      <div class="traceflow"><span>Requirement</span>→<span>Class</span>→<span>Pattern</span>→<span>DB constraint</span>→<span>Test</span></div></div>
    <input class="search" id="trq" type="search" placeholder="Filter, e.g. FR-5, Observer, UNIQUE…" aria-label="Filter requirements" value="${esc(traceQ)}">
    <div class="panel scroll-x" style="padding:6px"><table class="tbl"><thead><tr><th>ID</th><th>Requirement</th><th>Class</th><th>Pattern</th><th>Constraint</th><th>Test</th></tr></thead><tbody id="trb"></tbody></table></div>
    <div class="panel scroll-x" style="padding:6px"><table class="tbl"><thead><tr><th>ID</th><th>Quality</th><th>How it is met</th><th>Where</th></tr></thead><tbody>${NFRS.map(([i, q, h, w]) => `<tr><td class="fr">${i}</td><td>${q}</td><td>${esc(h)}</td><td>${clsChip(w)}</td></tr>`).join('')}</tbody></table></div>
  </section>`;
  paintTrace();
}
function paintTrace() {
  const q = traceQ.toLowerCase();
  const exact = /^n?fr-\d+$/i.test(traceQ.trim());
  $('#trb').innerHTML = FRS.filter(r => !q || (exact ? r[0].toLowerCase() === q.trim() : r.join(' ').toLowerCase().includes(q))).map(([i, r, c, p, k, t]) =>
    `<tr><td class="fr">${i}</td><td>${esc(r)}</td><td>${clsChip(c)}</td><td>${esc(p)}</td><td class="mono" style="font-size:.76rem">${esc(k)}</td><td class="mono" style="font-size:.76rem">${esc(t)}</td></tr>`).join('') || '<tr><td colspan="6" style="color:var(--muted)">No requirement matches. Clear the filter to see all 16.</td></tr>';
}

/* ===================== EVENTS ===================== */
document.addEventListener('click', e => {
  const t = e.target.closest('button, a, [data-table]');
  if (!t) return;
  const d = t.dataset;
  if (d.goto) { selected = d.goto; store.set('sel', selected); lens = null; if (location.hash === '#classes') { paintClasses(); window.scrollTo({ top: 0, behavior: 'smooth' }); } else location.hash = 'classes'; return; }
  if (d.cls) { selected = d.cls; store.set('sel', selected); paintClasses(); if (window.innerWidth < 900) $('#detail').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (d.lens) { const [type, id] = d.lens.split(':'); lens = lens && lens.type === type && lens.id === id ? null : { type, id }; if (location.hash !== '#classes') { location.hash = 'classes'; } else paintClasses(); return; }
  if (d.fr) { traceQ = d.fr; if (location.hash === '#trace') { $('#trq').value = traceQ; paintTrace(); } return; }
  if (d.flow) { stopPlay(); flowKey = d.flow; store.set('flow', flowKey); scenKey = null; step = 0; flows($('#main')); return; }
  if (d.scen) { stopPlay(); scenKey = d.scen; step = 0; flows($('#main')); return; }
  if (t.id === 'next') { stopPlay(); step++; paintSeq(); return; }
  if (t.id === 'prev') { stopPlay(); step--; paintSeq(); return; }
  if (t.id === 'restart') { stopPlay(); step = 0; paintSeq(); return; }
  if (t.id === 'play') {
    if (playT) { stopPlay(); return; }
    const n = FLOWS[flowKey].scenarios[scenKey].length; if (step >= n - 1) step = 0;
    t.textContent = 'Pause'; paintSeq();
    playT = setInterval(() => { if (step >= n - 1) return stopPlay(); step++; paintSeq(); }, 1300); return;
  }
  if (d.move) {
    if (d.move === 'reset') { tok = 'WAITING'; lastEdge = null; tlog = [{ t: 'New token issued → WAITING', c: 'good' }]; }
    else if (MOVES[tok][d.move]) { const n = MOVES[tok][d.move]; tlog.push({ t: `${d.move}(): ${tok} → ${n}`, c: 'good' }); tok = n; lastEdge = d.move; }
    else { tlog.push({ t: `409 ConflictError: Cannot ${VERB[d.move]} a token that is ${tok}`, c: 'bad' }); lastEdge = null; }
    paintSM(); return;
  }
  if (d.ppm) { ppm = Number(d.ppm); store.set('ppm', ppm); document.querySelectorAll('[data-ppm]').forEach(b => b.classList.toggle('on', b === t)); paintQ(); return; }
  if (d.table) { selT = d.table; store.set('table', selT); data($('#main')); $('#t-' + selT).scrollIntoView({ behavior: 'smooth', block: 'nearest' }); return; }
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.table) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  if (location.hash !== '#flows') return;
  const n = FLOWS[flowKey].scenarios[scenKey].length;
  if (e.key === 'ArrowRight' && step < n - 1) { stopPlay(); step++; paintSeq(); }
  if (e.key === 'ArrowLeft' && step > 0) { stopPlay(); step--; paintSeq(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'clock') { nowMin = Number(e.target.value); paintQ(); }
  if (e.target.id === 'apiq') paintApi(e.target.value);
  if (e.target.id === 'trq') { traceQ = e.target.value; paintTrace(); }
  if (['page', 'pemerg', 'pappt'].includes(e.target.id)) paintChain();
});
document.addEventListener('change', e => { if (['pemerg', 'pappt'].includes(e.target.id)) paintChain(); });
document.addEventListener('submit', e => {
  if (e.target.id !== 'addf') return;
  e.preventDefault();
  const ctx = chainCtx(), name = $('#pname').value.trim() || 'Patient';
  pq.push({ no: Math.max(...pq.map(t => t.no)) + 1, name, age: ctx.age, cat: resolveChain(ctx).cat, at: nowMin });
  paintQ();
});
window.addEventListener('hashchange', () => { stopPlay(); render(location.hash.slice(1)); window.scrollTo(0, 0); });
render(location.hash.slice(1) || 'overview');
</script>
